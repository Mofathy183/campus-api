name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  DATABASE_URL: postgresql://ci:ci@localhost:5432/campus_api_ci?schema=public
  JWT_ACCESS_TOKEN_SECRET: ci-only-secret-value-not-used-for-anything-real-32chars
  JWT_ACCESS_TOKEN_EXPIRES_IN: 1d
  JWT_ISSUER: campus-api
  JWT_AUDIENCE: campus-api-client

jobs:
  # Kept separate from the test jobs so a bad format/lint/type error
  # fails in seconds, before any job pays the cost of Prisma generate
  # + Vitest.
  static-checks:
    name: Static Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

  # Every feature imports from src/shared, so this is gated ahead of
  # the feature jobs — a broken shared module should fail once, here,
  # instead of as a repeated failure across all four features.
  shared-tests:
    name: Shared Layer Tests
    runs-on: ubuntu-latest
    needs: static-checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Test shared
        run: pnpm vitest run src/shared --coverage=false

  # --exclude drops *.routes.test.ts (the Supertest integration
  # suites), so this job only runs controller/service tests against
  # mocked Prisma.
  feature-unit-tests:
    name: Feature Unit Tests
    runs-on: ubuntu-latest
    needs: shared-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Test features (unit)
        run: >
          pnpm vitest run src/features
          --exclude "**/*.routes.test.ts"
          --coverage=false

  # IMPORTANT: the Vitest CLI filter matches a filename substring, not
  # a shell glob — "src/features/**/*.routes.test.ts" silently matches
  # zero files. ".routes.test" is what actually targets these files.
  #
  # These are the *.routes.test.ts Supertest suites: real Express app,
  # real Zod validation, real route wiring, with Prisma mocked at the
  # data-access boundary. Gated behind feature-unit-tests since a
  # route failure caused by broken service/controller logic is
  # redundant once the unit job already caught it.
  feature-integration-tests:
    name: Feature Integration Tests
    runs-on: ubuntu-latest
    needs: feature-unit-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Test features (integration)
        run: pnpm vitest run .routes.test --coverage=false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: feature-integration-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Build
        run: pnpm build