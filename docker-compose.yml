name: campus-api

services:
    postgres:
        image: postgres:17-alpine
        restart: unless-stopped
        environment:
            POSTGRES_USER: campus
            POSTGRES_PASSWORD: campus
            POSTGRES_DB: campus_api
        ports:
            - '5432:5432'
        volumes:
            - campus-api-pgdata:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U campus -d campus_api']
            interval: 5s
            timeout: 5s
            retries: 10

    api:
        build:
            context: .
            dockerfile: Dockerfile
            target: dev
        restart: unless-stopped
        env_file:
            - .env
        environment:
            # Overrides the .env value on purpose — inside the compose network
            # the DB is reachable at the service name "postgres", not localhost.
            DATABASE_URL: postgresql://campus:campus@postgres:5432/campus_api?schema=public
            PORT: 4000
        ports:
            - '4000:4000'
        volumes:
            - .:/app
            - /app/node_modules
        depends_on:
            postgres:
                condition: service_healthy
        command: pnpm dev

volumes:
    campus-api-pgdata:
